name: Build the feed
description: >-
  Builds feed.geojson, status.json and the map in _site/ for all of Spain from every
  registered source, on the Python the image ships, and fails on an empty feed. With an
  OpenStreetMap extract, also roads.json and the derived bearings (`radares roads`). Shared
  by the publishing job and the pull request job of feed.yml.

inputs:
  cache:
    description: RADARES_CACHE, the folder with each source's last good result
    required: true
  pbf:
    description: >-
      An OpenStreetMap extract (.osm.pbf) for `radares roads`; empty skips the roads step.
      A failed roads step never fails the build: the last good roads.json from the cache's
      roads/ folder is published and status.json says stale.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Build on the Python the image ships and the tests run on, read from the Dockerfile's FROM
    # line exactly as tests.yml does, so the published feed never runs on an untested interpreter.
    - name: Read the image's Python version
      shell: bash
      run: |
        version=$(sed -nE 's/^FROM[[:space:]]+python:([0-9]+\.[0-9]+\.[0-9]+)([-@[:space:]].*)?$/\1/p' Dockerfile)
        if [ -z "$version" ] || [ "$(printf '%s\n' "$version" | wc -l)" -ne 1 ]; then
          echo "::error file=Dockerfile::expected exactly one 'FROM python:X.Y.Z...' line, found: '${version}'"
          exit 1
        fi
        echo "Dockerfile ships Python $version"
        echo "UV_PYTHON=$version" >> "$GITHUB_ENV"
    # uv installs that Python itself: the self-hosted runner has only the system one.
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
    - name: Install
      shell: bash
      run: |
        # the roads group is pyosmium, for `radares roads`; the image never installs it
        uv sync --locked --no-dev --group roads
        actual=$(uv run --no-sync python -c 'import platform; print(platform.python_version())')
        echo "The feed builds on Python $actual (Dockerfile: $UV_PYTHON)"
        if [ "$actual" != "$UV_PYTHON" ]; then
          echo "::error::the feed would build on Python $actual, the image ships $UV_PYTHON"
          exit 1
        fi
    - name: Build the feed
      shell: bash
      env:
        RADARES_PROVINCES: all
        RADARES_SOURCES: default,osm_notes
        RADARES_CACHE: ${{ inputs.cache }}
      run: |
        rm -rf _site
        mkdir -p _site
        cp site/index.html site/map.js site/style.css site/icon.svg LICENSE-DATA.md _site/
        uv run --no-sync radares feed --output _site/feed.geojson --status _site/status.json --save-history
    - name: Follow the roads
      if: inputs.pbf != ''
      shell: bash
      env:
        PBF: ${{ inputs.pbf }}
        RADARES_CACHE: ${{ inputs.cache }}
      run: |
        if ! uv run --no-sync radares roads --feed _site/feed.geojson --status _site/status.json \
            --pbf "$PBF" --output _site/roads.json --fallback "$RADARES_CACHE/roads"; then
          echo "::warning::the roads step failed: roads.json is the last good one, if any, and status.json says stale"
        fi
    # Python, not jq: the self-hosted runner's image has no jq.
    - name: Report the sources
      shell: bash
      run: |
        uv run --no-sync python - <<'PY'
        import json, os, sys

        status = json.load(open("_site/status.json", encoding="utf-8"))
        rows = [
            "| source | status | radars | stretches | in feed | data from | updated | error |",
            "|---|---|---|---|---|---|---|---|",
        ]
        for s in status["sources"]:
            error = s["error"].replace("|", " ").replace("\n", " ")
            rows.append(
                f"| {s['source']} | {s['status']} | {s['radars']} | {s['stretches']} "
                f"| {s['in_feed']} | {s['data_time'] or 'never'} | {s['updated'] or ''} | {error} |"
            )
        rows += ["", f"Features in the feed: {status['features']}"]
        roads = status.get("roads")
        if roads:
            counts = ", ".join(
                f"{k} {v}" for k, v in roads.items() if k.startswith(("stretches", "points"))
            )
            rows += [
                "",
                f"roads.json: {roads['status']}, {roads.get('bytes', 0):,} bytes,"
                f" OSM data of {roads.get('osm_date')}; {counts}",
            ]
            if roads.get("error"):
                rows.append(f"roads error: {roads['error']}")
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
            fh.write("\n".join(rows) + "\n")
        print(json.dumps(status, indent=2, ensure_ascii=False))
        feed = json.load(open("_site/feed.geojson", encoding="utf-8"))
        if not feed["features"]:
            print("::error::the feed has no features; not publishing an empty feed over a good one")
            sys.exit(1)
        PY
