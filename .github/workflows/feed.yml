name: Feed

# Builds the feed for all of Spain from every registered source and publishes it, with its
# status and a map, to GitHub Pages.
#
# Two build jobs, split by event so that an ordinary pull request never reaches the
# self-hosted runner. A pull request runs its own copy of this file, so the split cannot
# stop a hostile one: the repository requires approval of every outside contributor's
# run, and the approver reads its changes under .github/ first (AGENTS.md).
# - publish: schedule and workflow_dispatch only, which no fork can trigger. It runs on a
#   self-hosted runner in Spain, because some sources answer only Spanish addresses.
# - check: pull_request only, on a GitHub-hosted runner. It builds the same files from an empty
#   cache without publishing them; the sources that answer only Spanish addresses fail fast
#   there and show as missing.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/actions/build-feed/**"
      - ".github/workflows/feed.yml"
      - "site/**"
      - "src/**"
      - "tests/fixtures/roads/**"
      - "LICENSE-DATA.md"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: feed-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64]
    # The roads step reads a 1.5 GB extract: about 6 minutes on a Mac mini's NVMe, up to three
    # times that on the runner's array, plus a download of a few minutes once a week.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The runner is not wiped between runs. Start from nothing but what the restore brings,
      # as a fresh runner would.
      - name: Clear the cache folder
        run: rm -rf "${{ runner.temp }}/radares-cache"
      # Each source's last good result, the announced streets and the geocoder answers (a street is
      # asked once), from the previous published run. A
      # source that is down falls back to it (sources.run). The downloads are NOT kept: a download
      # still fresh in the cache is reused without a request, and status.json would then call a
      # source `ok` with this run's time while its site is down.
      - name: Restore the last good results
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/radares-cache/sources
            ${{ runner.temp }}/radares-cache/announced.json
            ${{ runner.temp }}/radares-cache/geocoded
          key: feed-state-${{ github.run_id }}
          restore-keys: feed-state-
      # The last good roads.json and its status block, put back when the roads step fails. Its own
      # key: actions/cache matches an entry only on an identical path list, so adding it to the
      # list above would hide every source's last good result for one run.
      - name: Restore the last good road geometry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/radares-cache/roads
          key: roads-state-${{ github.run_id }}
          restore-keys: roads-state-
      # Geofabrik's extract of Spain (1.5 GB, rebuilt daily), refreshed when the copy is a week
      # old. It lives in the runner's bind-mounted _work folder, beside the workspace: the job
      # wipes runner.temp and an image update wipes the tool cache. A failed download leaves the
      # old copy, or none, and the roads step then republishes the last good roads.json.
      - name: Refresh the OpenStreetMap extract
        continue-on-error: true
        env:
          PBF_DIR: ${{ runner.workspace }}/../radares-pbf
        run: |
          mkdir -p "$PBF_DIR"
          file="$PBF_DIR/spain-latest.osm.pbf"
          if [ -f "$file" ] && [ -z "$(find "$file" -mtime +6)" ]; then
            echo "extract of $(date -u -r "$file" +%F), under a week old: kept"
            exit 0
          fi
          tmp="$file.download"
          rm -f "$tmp"
          since=()
          if [ -f "$file" ]; then since=(--time-cond "$file"); fi
          # --remote-time: the file's date is Geofabrik's Last-Modified, the day of the data
          curl --fail --location --silent --show-error --retry 3 --remote-time "${since[@]}" \
            --output "$tmp" https://download.geofabrik.de/europe/spain-latest.osm.pbf
          if [ -s "$tmp" ]; then mv "$tmp" "$file"; else rm -f "$tmp"; fi
          ls -l "$PBF_DIR"
      - name: Build the feed
        uses: ./.github/actions/build-feed
        with:
          cache: ${{ runner.temp }}/radares-cache
          pbf: ${{ runner.workspace }}/../radares-pbf/spain-latest.osm.pbf
      - name: Save the road geometry
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/radares-cache/roads
          key: roads-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save the last good results
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/radares-cache/sources
            ${{ runner.temp }}/radares-cache/announced.json
            ${{ runner.temp }}/radares-cache/geocoded
          key: feed-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # One try of at most 20 s per request for a source that answers only Spanish addresses:
      # from here it would wait out three timeouts per request, about 11 minutes in all.
      RADARES_SPANISH_IP_TIMEOUT: "20"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The roads step runs on a committed clip of the extract around Murcia, so every pull
      # request runs it end to end without downloading 1.5 GB from Geofabrik.
      - name: Build the feed
        uses: ./.github/actions/build-feed
        with:
          cache: ${{ runner.temp }}/radares-cache
          pbf: tests/fixtures/roads/clip.osm.pbf
      - name: Keep the built site for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feed-site
          path: _site
          retention-days: 7
      # The publishing job republishes the last good roads.json when the step fails; here a
      # failure (too large, too little followed inside the clip) must fail the pull request.
      - name: Check the roads step passed
        run: |
          python3 - <<'PY'
          import json, sys
          roads = json.load(open("_site/status.json", encoding="utf-8")).get("roads") or {}
          print(json.dumps(roads, indent=1))
          if roads.get("status") != "ok":
              print(f"::error::the roads step did not pass on the clip: {roads.get('error')}")
              sys.exit(1)
          PY

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
